<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velore Watches | Women</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            background: #080808;
            border-bottom: 1px solid #333;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            color: #d4af37;
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover {
            color: #d4af37;
        }

        .heading {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .heading h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .gold {
            color: #d4af37;
        }

        .heading p {
            color: #bbbbbb;
            line-height: 1.7;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            padding: 20px 8% 70px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            height: 300px;
            background: #222222;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, #000000dd);
            color: white;
        }

        .caption h3 {
            color: #d4af37;
            margin-bottom: 6px;
        }

        .caption p {
            font-size: 13px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #aaaaaa;
            background: #080808;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 550px) {
            header {
                flex-direction: column;
            }

            nav {
                text-align: center;
                line-height: 2.5;
            }

            nav a {
                margin: 0 7px;
            }

            .gallery {
                grid-template-columns: 1fr;
                padding: 20px 7% 50px;
            }

            .gallery-item {
                height: 330px;
            }

            .heading h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
